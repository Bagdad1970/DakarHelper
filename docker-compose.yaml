services:
  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d dakar_helper_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "5433:5432"

  flyway:
    image: flyway/flyway
    container_name: flyway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - FLYWAY_URL=${FLYWAY_URL}
      - FLYWAY_USER=${FLYWAY_USER}
      - FLYWAY_PASSWORD=${FLYWAY_PASSWORD}
      - FLYWAY_JDBC_DRIVERS=${FLYWAY_JDBC_DRIVERS}
      - FLYWAY_LOCATIONS=${FLYWAY_LOCATIONS}
    command: migrate
    volumes:
      - ./DakarHelperService/src/main/resources/db/migration:/flyway/sql

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db


  backend:
    container_name: backend
    build:
      context: .
      dockerfile: DakarHelperService/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SAVE_DIR=${SAVE_DIR}
      - MONGODB_URI=${MONGODB_URI}
      - POSTGRES_URL=${POSTGRES_URL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - EMAIL_LOGIN=${EMAIL_LOGIN}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_PROTOCOL=${EMAIL_PROTOCOL}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_FOLDER_NAME=${EMAIL_FOLDER_NAME}
      - EMAIL_FROM_TERM=${EMAIL_FROM_TERM}
    volumes:
      - vendor_data:/app/data
    depends_on:
      - postgres
      - mongodb

  frontend:
    image: node:25-slim
    container_name: frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"

volumes:
  pgdata:
  vendor_data:
  mongodata: